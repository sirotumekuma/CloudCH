name: Update YouTube videos

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Update latest videos from YouTube RSS
        env:
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: |
          if [ -z "$YOUTUBE_CHANNEL_ID" ]; then
            echo "YOUTUBE_CHANNEL_ID is not set; reading it from site-config.js."
            YOUTUBE_CHANNEL_ID="$(node -e "const fs=require('node:fs');const s=fs.readFileSync('site-config.js','utf8');const m=s.match(/channelId:\\s*['\"]([^'\"]+)['\"]/);if(m)process.stdout.write(m[1])")"
            if [ -z "$YOUTUBE_CHANNEL_ID" ]; then
              echo "::error::Set YOUTUBE_CHANNEL_ID in repository variables or configure channelId in site-config.js."
              exit 1
            fi
          fi
          export YOUTUBE_CHANNEL_ID
          node <<'NODE'
          const fs = require("node:fs");
          const channelId = process.env.YOUTUBE_CHANNEL_ID;
          const url = `https://www.youtube.com/feeds/videos.xml?channel_id=${encodeURIComponent(channelId)}`;

          function decodeXml(value) {
            return value
              .replace(/&amp;/g, "&")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&quot;/g, '"')
              .replace(/&#39;|&apos;/g, "'");
          }

          (async () => {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`YouTube RSS returned HTTP ${response.status}`);
            const xml = await response.text();
            const entries = [...xml.matchAll(/<entry>([\s\S]*?)<\/entry>/g)];
            const videos = entries.map(([, entry]) => {
              const id = entry.match(/<yt:videoId>([\s\S]*?)<\/yt:videoId>/)?.[1];
              const title = entry.match(/<title>([\s\S]*?)<\/title>/)?.[1];
              if (!id || !title) return null;
              return {
                id: decodeXml(id.trim()),
                title: decodeXml(title.trim()),
                thumbnail: `https://i.ytimg.com/vi/${encodeURIComponent(id.trim())}/hqdefault.jpg`,
                url: `https://www.youtube.com/watch?v=${encodeURIComponent(id.trim())}`
              };
            }).filter(Boolean).slice(0, 15);

            if (entries.length && videos.length === 0) throw new Error("No valid video entries were found in the RSS feed.");
            fs.writeFileSync("videos.json", `${JSON.stringify(videos, null, 2)}\n`);
            console.log(`Wrote ${videos.length} videos to videos.json.`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit updated video list
        run: |
          if git diff --quiet -- videos.json; then
            echo "Video list is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Update YouTube video list"
          git push
